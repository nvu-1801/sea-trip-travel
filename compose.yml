name: sea-trip
services:
  app:
    image: ${APP_IMAGE:-sea-trip:local}
    build:
      context: .
      args:
        APP_SHA: ${APP_SHA:-local}
    init: true
    restart: unless-stopped
    env_file: ${APP_ENV_FILE:-.env.production}
    environment:
      CMS_ENABLED: "1"
      CMS_DB_PATH: /app/data/seatrip.sqlite
      CMS_UPLOAD_DIR: /app/data/uploads
      CMS_BACKUP_DIR: /app/backups
    ports:
      - "127.0.0.1:${APP_BIND_PORT:-3080}:3000"
    volumes:
      - content:/app/data
      - ${APP_BACKUP_DIR:-../backups}:/app/backups:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:uid=1001,gid=1001,size=128m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  proxy:
    image: caddy:2-alpine
    profiles: [proxy]
    restart: unless-stopped
    command:
      - /bin/sh
      - -ec
      - ': "$${SITE_DOMAIN:?Set SITE_DOMAIN}"; : "$${ACME_EMAIL:?Set ACME_EMAIL}"; exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile'
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports: ["${HTTP_PORT:-80}:80", "${HTTPS_PORT:-443}:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app: { condition: service_healthy }
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
volumes:
  content:
    name: seatrip_content
  caddy_data:
  caddy_config:
